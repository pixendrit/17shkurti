name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Build
        # A project site is served from /<repo>, so the app needs that prefix.
        # Deriving it from the repo name keeps this working after a rename.
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Add 404 fallback for SPA routing
        # Pages serves 404.html for unknown paths; the SPA shell handles routing.
        run: cp build/index.html build/404.html

      - name: Configure Pages
        # enablement turns Pages on for the repo if it isn't already, so the
        # first deploy needs no manual toggle in Settings.
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
