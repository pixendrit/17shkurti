name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing by pushing the built site to the gh-pages branch, rather than the
# Pages artifact API: creating a Pages site needs a token the default
# GITHUB_TOKEN isn't, while pushing a branch only needs contents: write.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Build
        # A project site is served from /<repo>, so the app needs that prefix.
        # Deriving it from the repo name keeps this working after a rename.
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Prepare for Pages
        run: |
          # Pages serves 404.html for unknown paths; the SPA shell routes from there.
          cp build/index.html build/404.html
          # Stop Jekyll from processing the output.
          touch build/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd build
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
