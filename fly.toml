# Fly.io: keeps the SQLite file on a real persistent disk, so no hosted
# database is needed. `fly launch --no-deploy` then `fly deploy`.
app = "hijeshi-dashboard"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_URL = "file:/app/data/hijeshi.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine only: a SQLite file on a volume cannot be shared between them.
  min_machines_running = 1

[[mounts]]
  source = "hijeshi_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
